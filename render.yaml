services:
  - type: web
    name: mptracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m mptracker web
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
